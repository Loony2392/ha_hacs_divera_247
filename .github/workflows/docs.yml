name: 📚 Build Sphinx Docs and Deploy to Pages

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - 'custom_components/divera247/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          # Must match the Home Assistant runtime (HA requires >=3.13) because
          # conf.py enables autodoc and imports the integration.
          python-version: '3.13'

      - name: ⚙️ Configure Pages
        uses: actions/configure-pages@v6

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f docs/requirements.txt ]; then pip install -r docs/requirements.txt; else pip install sphinx sphinx_rtd_theme; fi

      - name: 🛠️ Build documentation (Sphinx)
        env:
          # Home Assistant is mocked via autodoc_mock_imports (see docs/conf.py).
          # apidoc's default :undoc-members:/:show-inheritance: make autodoc walk
          # the mocks' unbounded attribute chains and the build hangs, so
          # restrict it to :members:.
          SPHINX_APIDOC_OPTIONS: members
        run: |
          sphinx-apidoc -o docs/source custom_components/divera247
          sphinx-build -b html docs docs/build

      - name: 📦 Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
